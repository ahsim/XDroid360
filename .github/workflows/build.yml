name: Build XDroid360

# The player's APK: the launcher with everything it needs to build the games on the phone.
#   toolchain  the on-phone tools, built here from pinned sources (toolchain/env.sh): clang and
#              lld 22.1.8 for aarch64-android29 (cached: the first build takes one to two
#              hours), the patched XenonRecomp, the STFS extractor, and the kit.
#   apk        DAO's game profile (dao.zip), built here from DAORecomp's runtime (the recomp
#              fork) and profiles/dao (no game code or data); State of Decay's profile from
#              SoDRecomp's release, by the asset and SHA-256 pinned in android/toolchain.lock.json;
#              then the release APK, checked to carry all of it.
#
# Signing: the release APK is signed with the release key when the repository's secrets hold it
# (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  the key store file (.p12), base64-encoded
#   RELEASE_STORE_PASSWORD   its password
#   RELEASE_KEY_ALIAS        the key's alias
#   RELEASE_KEY_PASSWORD     the key's password
# Without them (pull requests from forks, say) it is debug-signed, as android/app/build.gradle does.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: toolchain
    env:
      CMAKE: cmake
      NINJA: ninja
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space and set up the build folder
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h / /mnt

      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Install NDK 27.3.13750724
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      # LLVM's release, XenonRecomp at its commit patched by the pinned patch script, SDL.
      - name: Fetch the pinned sources
        run: bash fetch_sources.sh

      - name: Restore clang and lld
        id: llvm
        uses: actions/cache@v4
        with:
          path: |
            toolchain/stage/bin/clang
            toolchain/stage/bin/lld
            toolchain/stage/lib/clang
          key: llvm-${{ hashFiles('toolchain/env.sh', 'toolchain/configure_android_llvm.sh', 'toolchain/build_host_tablegen.sh') }}

      - name: Build the host tablegens
        if: steps.llvm.outputs.cache-hit != 'true'
        run: HOST_TABLEGEN_BUILD_DIR=/mnt/work/build-host bash build_host_tablegen.sh

      - name: Build clang and lld
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          HOST_LLVM_BIN=/mnt/work/build-host/bin LLVM_BUILD_DIR=/mnt/work/build-android bash build_tools.sh llvm
          rm -rf /mnt/work/build-android /mnt/work/build-host

      - name: Build XenonRecomp and the STFS extractor
        run: |
          bash build_tools.sh xr
          bash build_tools.sh stfs

      # Every library must be 16 KB-aligned: a 16 KB-page kernel refuses the others.
      - name: Package and check alignment
        run: |
          set -euo pipefail
          RELEASE="dev-${GITHUB_SHA::7}" bash package.sh
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for f in out/jniLibs/arm64-v8a/*.so; do
            for a in $("$READELF" -lW "$f" | awk '/LOAD/{print $NF}'); do
              [ $((a)) -ge 16384 ] || { echo "$f: LOAD aligned to $a"; exit 1; }
            done
          done
          # libxenonrecomp.so's exact source (GPL-2.0-or-later): XenonRecomp at its pinned commit
          # with its submodules, as patched, the patch script, and these build scripts.
          tar -czf out/xenonrecomp-source.tar.gz --exclude=.git \
            -C sources XenonRecomp patch_recompiler.py \
            -C "$GITHUB_WORKSPACE/toolchain" env.sh build_tools.sh fetch_sources.sh licenses/GPL-2.0.txt

      - name: Keep the toolchain
        uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: |
            toolchain/out/jniLibs
            toolchain/out/kit.zip
            toolchain/out/kit/kit.json
            toolchain/out/xenonrecomp-source.tar.gz
          retention-days: 30

  apk:
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          PROFILE=$(python3 -c 'import re;print(re.search(r"VERSION = \"(dao-[0-9]+)\"", open("scripts/make_dao_profile.py").read()).group(1))')
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        shell: bash
        run: |
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          # The SDK's CMake and Ninja, and the NDK's LLVM (llvm-ar, llvm-strip) for the profile.
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Take the toolchain
        uses: actions/download-artifact@v4
        with:
          name: toolchain
          path: build/toolchain

      # DAORecomp's pinned sources (Xenia's third-party code, XenonRecomp, SDL), as its installer
      # checks them out, and XenonRecomp patched.
      - name: Fetch the build's sources
        run: python3 -I scripts/fetch_build_sources.py

      - name: Fetch State of Decay's profile
        run: python3 -I scripts/fetch_toolchain.py --out build/fetched

      - name: Build DAO's game profile
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S android/app/src/main/cpp -B build/profile-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DXDROID360_PROFILE_BUILD=ON
          python3 -I scripts/make_dao_profile.py --build build/profile-android --kit build/toolchain/kit --out build/profile

      # A profile made for other tools than the kit's would be refused on the phone.
      - name: Check the profiles against the kit
        run: python3 -I scripts/check_profiles.py build/toolchain/kit/kit.json build/profile/dao.zip build/fetched/games/sod.zip

      # The key store goes to the runner's temp folder, never into the workspace.
      - name: Set up release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "No release key in the secrets: the release APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build the launcher APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleLauncherRelease -Pxdroid360.toolchain="$GITHUB_WORKSPACE/build/toolchain" \
            -Pxdroid360.sodProfile="$GITHUB_WORKSPACE/build/fetched/games/sod.zip"

      - name: Remove the key store
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" android/keystore.properties

      # The APK must carry the toolchain and both profiles, or it can't build a game.
      - name: Check the APK's contents
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/launcher/release/xdroid360-launcher-release-${{ steps.app_version.outputs.name }}.apk
          LIST=$(unzip -l "$APK")
          for f in lib/arm64-v8a/libclang.so lib/arm64-v8a/liblld.so lib/arm64-v8a/libxenonrecomp.so \
                   lib/arm64-v8a/libstfsextract.so lib/arm64-v8a/libSDL3.so assets/kit.zip \
                   assets/games/dao.zip assets/games/sod.zip; do
            # A here-string, not a pipe: grep -q stops at the first match, and the writer of a
            # pipe would then fail with "Broken pipe" under pipefail.
            grep -q " $f\$" <<< "$LIST" || { echo "missing in the APK: $f"; exit 1; }
          done
          ls -l "$APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: xdroid360-launcher-release-${{ steps.app_version.outputs.name }}
          path: android/app/build/outputs/apk/launcher/release/xdroid360-launcher-release-${{ steps.app_version.outputs.name }}.apk
          retention-days: 30

      # DAO's profile on its own (xdroid360-profile-<version>.zip), for the release page.
      - name: Name DAO's profile
        shell: bash
        run: |
          cp build/profile/dao.zip "build/profile/xdroid360-profile-${{ steps.app_version.outputs.profile }}.zip"
          (cd build/profile && sha256sum "xdroid360-profile-${{ steps.app_version.outputs.profile }}.zip" > SHA256SUMS)
      - name: Upload DAO's profile
        uses: actions/upload-artifact@v4
        with:
          name: xdroid360-profile-${{ steps.app_version.outputs.profile }}
          path: |
            build/profile/xdroid360-profile-${{ steps.app_version.outputs.profile }}.zip
            build/profile/SHA256SUMS
          retention-days: 30

      # Who signed the release APK (the release key, or Android Debug without the secrets).
      # Informational only: it never fails the build.
      - name: Show the release APK's signer
        continue-on-error: true
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/launcher/release/xdroid360-launcher-release-${{ steps.app_version.outputs.name }}.apk
