name: Build XDroid360

# The player's APK: the launcher with everything it needs to build the games on the phone.
#   - DAO's game profile (dao.zip) is built here, from DAORecomp's runtime (the recomp fork) and
#     profiles/dao (no game code or data: scripts/make_dao_profile.py, XDROID360_PROFILE_BUILD).
#   - The on-phone toolchain (clang, lld, XenonRecomp, the STFS extractor), the kit and State of
#     Decay's profile come from their own repositories' releases, by the exact assets and SHA-256
#     values pinned in android/toolchain.lock.json (scripts/fetch_toolchain.py).
# An APK without them can't build any game, so none is published.
#
# Signing: the release APK is signed with the release key when the repository's secrets hold it
# (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  the key store file (.p12), base64-encoded
#   RELEASE_STORE_PASSWORD   its password
#   RELEASE_KEY_ALIAS        the key's alias
#   RELEASE_KEY_PASSWORD     the key's password
# Without them (pull requests from forks, say) it is debug-signed, as android/app/build.gradle does.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          PROFILE=$(python3 -c 'import re;print(re.search(r"VERSION = \"(dao-[0-9]+)\"", open("scripts/make_dao_profile.py").read()).group(1))')
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        shell: bash
        run: |
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          # The SDK's CMake and Ninja, and the NDK's LLVM (llvm-ar, llvm-strip) for the profile.
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # DAORecomp's pinned sources (Xenia's third-party code, XenonRecomp, SDL), as its installer
      # checks them out, and XenonRecomp patched.
      - name: Fetch the build's sources
        run: python3 -I scripts/fetch_build_sources.py

      - name: Fetch the toolchain and State of Decay's profile
        run: python3 -I scripts/fetch_toolchain.py --out build/toolchain

      - name: Build DAO's game profile
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S android/app/src/main/cpp -B build/profile-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DXDROID360_PROFILE_BUILD=ON
          python3 -I scripts/make_dao_profile.py --build build/profile-android --kit build/toolchain/kit --out build/profile
          sha256sum build/profile/dao.zip | tee build/profile/dao.zip.sha256

      # The key store goes to the runner's temp folder, never into the workspace.
      - name: Set up release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "No release key in the secrets: the release APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build the launcher APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleLauncherRelease -Pxdroid360.toolchain="$GITHUB_WORKSPACE/build/toolchain"

      - name: Remove the key store
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" android/keystore.properties

      # The APK must carry the toolchain and both profiles, or it can't build a game.
      - name: Check the APK's contents
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/launcher/release/xdroid360-launcher-release-${{ steps.app_version.outputs.name }}.apk
          LIST=$(unzip -l "$APK")
          for f in lib/arm64-v8a/libclang.so lib/arm64-v8a/liblld.so lib/arm64-v8a/libxenonrecomp.so \
                   lib/arm64-v8a/libstfsextract.so lib/arm64-v8a/libSDL3.so assets/kit.zip \
                   assets/games/dao.zip assets/games/sod.zip; do
            echo "$LIST" | grep -q " $f\$" || { echo "missing in the APK: $f"; exit 1; }
          done
          ls -l "$APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: xdroid360-launcher-release-${{ steps.app_version.outputs.name }}
          path: android/app/build/outputs/apk/launcher/release/xdroid360-launcher-release-${{ steps.app_version.outputs.name }}.apk
          retention-days: 30

      # DAO's profile on its own (xdroid360-profile-<version>.zip), for the release page.
      - name: Upload DAO's profile
        shell: bash
        run: |
          cp build/profile/dao.zip "build/profile/xdroid360-profile-${{ steps.app_version.outputs.profile }}.zip"
          (cd build/profile && sha256sum "xdroid360-profile-${{ steps.app_version.outputs.profile }}.zip" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: xdroid360-profile-${{ steps.app_version.outputs.profile }}
          path: |
            build/profile/xdroid360-profile-${{ steps.app_version.outputs.profile }}.zip
            build/profile/SHA256SUMS
          retention-days: 30

      # Who signed the release APK (the release key, or Android Debug without the secrets).
      # Informational only: it never fails the build.
      - name: Show the release APK's signer
        continue-on-error: true
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/launcher/release/xdroid360-launcher-release-${{ steps.app_version.outputs.name }}.apk
