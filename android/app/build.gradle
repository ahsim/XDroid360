// The XDroid360 app: SDL3's Java side plus GameActivity, and the native build
// (src/main/cpp/CMakeLists.txt): libSDL3.so, libgame.so (the runtime, Xenia's Vulkan GPU
// and the translated game code from recomp/ppc), libvkdriverhook.so. Build it only from
// your own disc's translated code (README): the APK holds that code and is yours alone.
plugins {
    id 'com.android.application'
}

// The release key (the one all the author's launchers share) is kept out of git:
// android/keystore.properties (gitignored) names storeFile, storePassword, keyAlias and
// keyPassword. Without it, the launcher's release APK is debug-signed like the rest.
def signingFile = rootProject.file("keystore.properties")
def signing = new Properties()
if (signingFile.isFile()) {
    signingFile.withInputStream { signing.load(it) }
}
def hasSigning = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every { signing.getProperty(it) }

// Building games on the phone: the toolchain (clang, lld and XenonRecomp as jniLibs, kit.zip),
// made by SD1/toolchain, and the game profiles (games/<id>.zip): SoD's from the toolchain's
// output, DAO's from scripts/make_dao_profile.py. Override the folder with
// -Pxdroid360.toolchain=<dir>. Without it the APK can't build games (Toolchain.present).
def toolchainOut = file(project.findProperty("xdroid360.toolchain") ?: "${rootDir}/../../SD1/toolchain/out")
def daoProfile = file("${rootDir}/../build/profile/dao.zip")
def toolchainAssets = layout.buildDirectory.dir("generated/toolchain/assets")
def copyToolchainAssets = tasks.register("copyToolchainAssets", Sync) {
    into toolchainAssets
    from(toolchainOut) { include "kit.zip" }
    from(file("${toolchainOut}/games")) {
        include "*.zip"
        into "games"
    }
    from(daoProfile.parentFile) {
        include daoProfile.name
        into "games"
    }
}

android {
    namespace 'com.udarmolota.xdroid360'
    compileSdk 36
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "com.udarmolota.xdroid360"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0-phase5"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-29",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Two APKs: "dev" holds the game library built from this PC's translated code (the
    // development build, never shared); "launcher" holds none (no game code at all) and builds
    // each game on the phone from the player's own disc (BuildService).
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(signing.getProperty("storeFile"))
                storePassword signing.getProperty("storePassword")
                keyAlias signing.getProperty("keyAlias")
                keyPassword signing.getProperty("keyPassword")
            }
        }
    }

    flavorDimensions "kind"
    productFlavors {
        dev {
            dimension "kind"
            // Debug-signed: adb install -r replaces the debug build without wiping the app's
            // data. Nobody distributes this APK (README).
            signingConfig signingConfigs.debug
        }
        launcher {
            dimension "kind"
            versionNameSuffix "-launcher"
            // The published APK: the release key when keystore.properties is there (launcher
            // debug builds stay debug-signed: the debug build type sets its own).
            signingConfig hasSigning ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments "-DDAO_LAUNCHER_ONLY=ON"
                }
            }
        }
    }

    // xdroid360-<flavor>-<build type>-<version>.apk, e.g. xdroid360-launcher-release-0.1.0.apk
    // (the version without the flavor's suffix: the flavor is in the name already).
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "xdroid360-${variant.flavorName}-${variant.buildType.name}-${defaultConfig.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed per flavor (above).
        }
        debug {
            // The native code is always an optimized build (the game is unplayable otherwise).
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }

    packaging {
        jniLibs {
            // Extracted to nativeLibraryDir: the tools run from there as programs.
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += file("${toolchainOut}/jniLibs")
            assets.srcDir(toolchainAssets)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

preBuild.dependsOn copyToolchainAssets

dependencies {
    // The launcher's screens (the game itself is SDL's activity, no AndroidX).
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}
